# 服务器配置
server:
  port: 9080
  mode: debug # debug, release, test

# 数据库配置
database:
  host: 127.0.0.1
  port: 3306
  username: root
  password: root
  dbname: righthand
  charset: utf8mb4
  parseTime: true
  loc: Asia/Shanghai
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600


# JWT配置
jwt:
  secret: righthand-secret-key-2024-very-long-and-secure
  expire: 7200 # 2小时，单位秒
  issuer: righthand-auth

# 日志配置（按日期切割：./logs/app-YYYY-MM-DD.log）
log:
  level: info # debug, info, warn, error（预留，本轮未强制生效）
  format: console # console 文本 / json 结构化（json 预留，本轮未启用）
  output: both # stdout / file / both（both = 控制台 + 按日期文件）
  file_path: ./logs/app.log # 实际写入目录下的 app-YYYY-MM-DD.log（按日期切割）
  max_size: 100 # MB（预留，本轮未启用大小切分）
  max_backups: 10 # 最多保留日志文件数（含当日）
  max_age: 30 # days（超过天数的历史文件自动清理）

# CORS配置
cors:
  allow_origins:
    - http://localhost:5173
    - http://localhost:3000
    - http://localhost:80
  allow_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allow_headers:
    - Content-Type
    - Authorization
  allow_credentials: true
  max_age: 3600